<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Kharit</title>
    <meta name="description" content="Inicia sesión en Kharit, tu sistema de gestión de inventario.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

    <a href="#contenido-principal" class="skip-link">Saltar al contenido principal</a>

    <header class="site-header">
        <p class="brand-name">Kharit</p>
        <p class="brand-tagline">Gestión de inventario para tu negocio</p>
    </header>

    <nav class="nav-public" aria-label="Navegación principal">
        <ul>
            <li><a href="index.html">Inicio</a></li>
        </ul>
    </nav>

    <main id="contenido-principal">
        <section class="section-auth" aria-labelledby="tituloLogin">
            <h1 id="tituloLogin">Iniciar sesión</h1>

            <!-- Los campos email/password coinciden con supabase.auth.signInWithPassword({ email, password }) -->
            <form id="formLogin" class="form-auth" action="#" method="post" data-supabase-auth="signInWithPassword" novalidate>
                <fieldset>
                    <legend>Credenciales de acceso</legend>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" autocomplete="username" placeholder="nombre@empresa.com" maxlength="150" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" minlength="8" maxlength="72" required>
                    </div>

                    <div class="form-group form-group-inline">
                        <input type="checkbox" id="recordarSesion" name="recordar_sesion">
                        <label for="recordarSesion">Mantener sesión iniciada</label>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" id="btnIniciarSesion" class="btn-primary">Iniciar sesión</button>
                </div>
            </form>

            <p class="form-links">
                <a href="recuperar_password.html">¿Olvidaste tu contraseña?</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Kharit. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="assets/js/supabase-client.js" defer></script>
    <script src="assets/js/auth-guard.js" defer></script>
    <script src="assets/js/catalogos.js" defer></script>
    <script src="assets/js/compras-ventas.js" defer></script>
    <script src="assets/js/inventario.js" defer></script>
    <script src="assets/js/perfil.js" defer></script>
    <script src="assets/js/configuracion.js" defer></script>
    <script src="assets/js/usuarios.js" defer></script>
    <script src="assets/js/main.js" defer></script>
</body>
</html>
